<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Bill Entry - Lakshmi Stone Crusher & Suppliers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=1787172100">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=1787172100"></script>
  <script src="assets/js/supabase-client.js?v=1787172100"></script>
  <script src="assets/js/utils.js?v=1787172100"></script>
  <script src="assets/js/auth.js?v=1787172100"></script>
  <script src="assets/js/db-service.js?v=1787172100"></script>
  <script src="assets/js/layout.js?v=1787172100"></script>
</head>
<body>
  
  <div id="app" class="p-2 sm:p-4 max-w-7xl mx-auto pb-24">
    
    <div class="flex justify-between items-end mb-4">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-gray-900">Daily Dispatch Log</h1>
        <p class="text-xs text-gray-500 font-medium mt-1">Record multiple trips and sales in spreadsheet format.</p>
      </div>
      
      <div class="flex gap-4 items-center bg-white p-2 px-4 rounded-xl shadow-sm border border-gray-200">
        <div class="flex flex-col">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Day</label>
          <input type="text" id="log-day" class="form-input h-8 text-sm font-semibold w-32" placeholder="e.g. Monday">
        </div>
        <div class="flex flex-col">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Date</label>
          <input type="date" id="log-date" class="form-input h-8 text-sm font-semibold">
        </div>
      </div>
    </div>

    <form id="daily-log-form" onsubmit="handleSaveLog(event)">
      <!-- Global Settings -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-4 flex flex-wrap gap-4 items-center">
        <div class="flex items-center gap-2">
          <label class="text-[10px] font-bold text-gray-500 uppercase">Apply GST (18%)</label>
          <select id="adv-gst" class="form-select h-8 text-xs font-semibold py-0">
            <option value="0">No (Plain)</option>
            <option value="18">Yes (18%)</option>
          </select>
        </div>
        <div class="flex items-center gap-2 border-l border-gray-200 pl-4">
          <label class="text-[10px] font-bold text-gray-500 uppercase">Payment Default</label>
          <select id="adv-pay" class="form-select h-8 text-xs font-semibold py-0">
            <option value="cash">Cash (Full)</option>
            <option value="upi">UPI (Full)</option>
            <option value="due">Keep Due</option>
          </select>
        </div>
      </div>

      <!-- Spreadsheet Table -->
      <div class="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-300">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse" id="log-table">
            <thead>
              <tr class="bg-slate-800 text-white text-[10px] uppercase tracking-wider">
                <th class="p-2 border border-slate-700 w-10 text-center">#</th>
                <th class="p-2 border border-slate-700 min-w-[150px]">Owner Name</th>
                <th class="p-2 border border-slate-700 min-w-[120px]">Vehicle No</th>
                <th class="p-2 border border-slate-700 min-w-[120px]">Destination</th>
                <th class="p-2 border border-slate-700 min-w-[140px]">Material</th>
                <th class="p-2 border border-slate-700 w-20">Trip</th>
                <th class="p-2 border border-slate-700 w-24">Brass(Qty)</th>
                <th class="p-2 border border-slate-700 w-24">Rate</th>
                <th class="p-2 border border-slate-700 w-28 text-right">Total</th>
                <th class="p-2 border border-slate-700 w-10 text-center">Act</th>
              </tr>
            </thead>
            <tbody id="log-body">
              <!-- Rows will be injected here -->
            </tbody>
            <tfoot>
              <tr class="bg-gray-50 border-t-2 border-gray-300">
                <td colspan="8" class="p-3 text-right text-xs font-bold text-gray-600 uppercase tracking-wider">Grand Total (All Rows)</td>
                <td class="p-3 text-right font-black text-gray-900 text-sm" id="grand-total-display">₹0.00</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="p-3 bg-gray-50 border-t border-gray-200">
          <button type="button" onclick="addRow()" class="btn btn-secondary text-xs px-4 py-1.5 border-dashed">
            + Add New Row
          </button>
        </div>
      </div>

      <!-- Bottom Bar -->
      <div class="fixed bottom-0 left-0 right-0 md:left-64 bg-white border-t border-slate-200 p-4 z-30 shadow-[0_-4px_6px_-1px_rgb(0,0,0,0.05)]">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
          <div class="text-xs font-medium text-slate-500">
            Records will be grouped by Owner Name into separate invoices.
          </div>
          <div class="flex items-center gap-3 w-full md:w-auto">
            <button type="button" onclick="clearDraft()" id="btn-clear-draft" class="btn bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 flex-1 md:flex-none hidden">
              Clear Draft
            </button>
            <button type="button" onclick="saveDraft()" id="btn-save-draft" class="btn bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 flex-1 md:flex-none">
              Save as Draft
            </button>
            <button type="submit" id="btn-submit" class="btn btn-primary shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 px-6 flex-1 md:flex-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
              Save Daily Log
            </button>
          </div>
        </div>
      </div>
    </form>
    
    <!-- Customer Modal -->
    <div id="modal-customer" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
          <h3 class="font-bold text-slate-800 flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
            </div>
            Add New Customer
          </h3>
          <button type="button" onclick="closeNewCustModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-md hover:bg-slate-100 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="p-5 overflow-y-auto">
          <form id="new-cust-form" onsubmit="handleCreateCustomer(event)" class="space-y-4">
            <div>
              <label class="form-label text-xs font-semibold text-slate-700">Full Name *</label>
              <input type="text" id="new-c-name" required class="form-input text-sm" placeholder="e.g. Rahul Patil">
            </div>
            <div>
              <label class="form-label text-xs font-semibold text-slate-700">Mobile Number</label>
              <input type="tel" id="new-c-mob" class="form-input text-sm" placeholder="10-digit number">
            </div>
            <div>
              <label class="form-label text-xs font-semibold text-slate-700">Address / Location</label>
              <textarea id="new-c-addr" rows="2" class="form-input text-sm resize-none" placeholder="City or area"></textarea>
            </div>
            <div class="pt-4 flex gap-3">
              <button type="button" onclick="closeNewCustModal()" class="btn bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 flex-1">Cancel</button>
              <button type="submit" class="btn btn-primary flex-1">Save Customer</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    let materials = [];
    let customers = [];
    let rowCount = 0;
    
    // Set default day and date
    document.addEventListener('DOMContentLoaded', async () => {
      window.LSCLayout.init('sale-new', 'Daily Dispatch Log');
      
      const now = new Date();
      document.getElementById('log-date').value = window.LSCUtils.formatISO(now);
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      document.getElementById('log-day').value = days[now.getDay()];

      try {
        const [mats, custs] = await Promise.all([
          window.LSCDB.getMaterials(),
          window.LSCDB.getCustomers()
        ]);
        materials = mats;
        customers = custs;
        
        // Check if editing an existing bill (might need special handling, but for now we just add one empty row)
        // If edit_id is present, we might want to load it. For simplicity, we just add a blank row first.
        let editSaleId = window.LSCUtils.getQueryParam('edit_id');
        if (editSaleId) {
            alert('Edit mode is currently restricted in the new spreadsheet view. Please delete and re-enter, or contact support.');
            window.location.href = 'sales.html';
            return;
        }

        loadDraft();
      } catch (err) {
        console.error(err);
        alert('Error loading data: ' + err.message);
      }
    });

    function getCustomerOptions() {
      let opts = '<option value="">-- Select Owner --</option>';
      customers.forEach(c => {
        opts += `<option value="${c.id}">${c.name}</option>`;
      });
      return opts;
    }

    function getMaterialOptions() {
      let opts = '<option value="">-- Select Material --</option>';
      materials.forEach(m => {
        opts += `<option value="${m.id}" data-rate="${m.rate_per_unit||0}">${m.name}</option>`;
      });
      return opts;
    }

    function addRow() {
      rowCount++;
      const id = rowCount;
      const tr = document.createElement('tr');
      tr.id = `row-${id}`;
      tr.className = "hover:bg-slate-50 transition-colors group";
      
      tr.innerHTML = `
        <td class="p-1 border border-slate-200 text-center text-xs text-slate-400 font-medium">${id}</td>
        <td class="p-1 border border-slate-200">
          <div class="flex items-center gap-1">
            <select required class="row-cust form-select text-xs font-semibold py-1 px-2 h-7 w-full border-0 bg-transparent focus:ring-1 focus:ring-blue-500 rounded-sm">
              ${getCustomerOptions()}
            </select>
            <button type="button" onclick="openNewCustModal()" class="text-blue-500 hover:text-blue-700 p-1" title="Add New Owner">+</button>
          </div>
        </td>
        <td class="p-1 border border-slate-200">
          <input type="text" class="row-veh form-input text-xs font-semibold py-1 px-2 h-7 w-full border-0 bg-transparent focus:ring-1 focus:ring-blue-500 rounded-sm" placeholder="e.g. MH12">
        </td>
        <td class="p-1 border border-slate-200">
          <input type="text" class="row-dest form-input text-xs font-semibold py-1 px-2 h-7 w-full border-0 bg-transparent focus:ring-1 focus:ring-blue-500 rounded-sm" placeholder="e.g. Pune">
        </td>
        <td class="p-1 border border-slate-200">
          <select required class="row-mat form-select text-xs font-semibold py-1 px-2 h-7 w-full border-0 bg-transparent focus:ring-1 focus:ring-blue-500 rounded-sm" onchange="onMaterialChange(${id})">
            ${getMaterialOptions()}
          </select>
        </td>
        <td class="p-1 border border-slate-200">
          <input type="number" class="row-trip form-input text-xs font-semibold py-1 px-2 h-7 w-full border-0 bg-transparent focus:ring-1 focus:ring-blue-500 rounded-sm" value="1" min="1">
        </td>
        <td class="p-1 border border-slate-200">
          <input type="number" required step="0.001" min="0.001" class="row-qty form-input text-xs font-semibold py-1 px-2 h-7 w-full border-0 bg-transparent focus:ring-1 focus:ring-blue-500 rounded-sm" placeholder="0" oninput="handleMathChange(${id})">
        </td>
        <td class="p-1 border border-slate-200">
          <input type="number" required step="0.01" min="0" class="row-rate form-input text-xs font-semibold py-1 px-2 h-7 w-full border-0 bg-transparent focus:ring-1 focus:ring-blue-500 rounded-sm" placeholder="0" oninput="handleMathChange(${id})">
        </td>
        <td class="p-1 border border-slate-200">
          <input type="number" required step="0.01" min="0" class="row-total form-input text-[13px] font-bold py-1 px-2 h-7 w-full text-right border-0 bg-transparent focus:ring-1 focus:ring-blue-500 rounded-sm" value="0.00" oninput="handleTotalChange(${id})">
        </td>
        <td class="p-1 border border-slate-200 text-center">
          <button type="button" onclick="removeRow(${id})" class="text-slate-300 hover:text-red-500 font-bold transition-colors">&times;</button>
        </td>
      `;
      document.getElementById('log-body').appendChild(tr);
    }

    function removeRow(id) {
      const row = document.getElementById(`row-${id}`);
      if (row) {
        row.remove();
        calculateGrandTotal();
      }
    }

    function onMaterialChange(id) {
      const row = document.getElementById(`row-${id}`);
      const sel = row.querySelector('.row-mat');
      if (!sel.value) return;
      
      const opt = sel.options[sel.selectedIndex];
      if (opt.dataset.rate) {
        row.querySelector('.row-rate').value = opt.dataset.rate;
      }
      handleMathChange(id);
    }

    function handleMathChange(id) {
      const row = document.getElementById(`row-${id}`);
      const qty = parseFloat(row.querySelector('.row-qty').value) || 0;
      const rate = parseFloat(row.querySelector('.row-rate').value) || 0;
      const totalInput = row.querySelector('.row-total');
      totalInput.value = (qty * rate).toFixed(2);
      calculateGrandTotal();
    }

    function handleTotalChange(id) {
      const row = document.getElementById(`row-${id}`);
      const qty = parseFloat(row.querySelector('.row-qty').value) || 0;
      const total = parseFloat(row.querySelector('.row-total').value) || 0;
      if (qty > 0) {
        row.querySelector('.row-rate').value = (total / qty).toFixed(2);
      }
      calculateGrandTotal();
    }

    function calculateGrandTotal() {
      let grandTotal = 0;
      const totals = document.querySelectorAll('.row-total');
      totals.forEach(inp => {
        grandTotal += parseFloat(inp.value) || 0;
      });
      
      const gstVal = parseFloat(document.getElementById('adv-gst').value) || 0;
      if (gstVal > 0) {
        grandTotal += grandTotal * (gstVal / 100);
      }
      
      document.getElementById('grand-total-display').textContent = window.LSCUtils.formatCurrency(grandTotal);
    }

    
    // --- Draft Logic ---
    function saveDraft() {
      const rows = document.querySelectorAll('#log-body tr');
      if (rows.length === 0) {
        window.LSCUtils.showNotification('Nothing to save.', 'error');
        return;
      }
      
      const draftData = {
        date: document.getElementById('log-date').value,
        day: document.getElementById('log-day').value,
        gst: document.getElementById('adv-gst').value,
        pay: document.getElementById('adv-pay').value,
        rows: []
      };

      rows.forEach(row => {
        draftData.rows.push({
          cust: row.querySelector('.row-cust').value,
          veh: row.querySelector('.row-veh').value,
          dest: row.querySelector('.row-dest').value,
          mat: row.querySelector('.row-mat').value,
          trip: row.querySelector('.row-trip').value,
          qty: row.querySelector('.row-qty').value,
          rate: row.querySelector('.row-rate').value,
          total: row.querySelector('.row-total').value
        });
      });

      localStorage.setItem('lsc_daily_log_draft', JSON.stringify(draftData));
      document.getElementById('btn-clear-draft').classList.remove('hidden');
      window.LSCUtils.showNotification('Draft saved successfully!', 'success');
    }

    function loadDraft() {
      const draftJson = localStorage.getItem('lsc_daily_log_draft');
      if (!draftJson) {
         addRow(); // default
         return;
      }
      
      try {
        const draft = JSON.parse(draftJson);
        if (draft.date) document.getElementById('log-date').value = draft.date;
        if (draft.day) document.getElementById('log-day').value = draft.day;
        if (draft.gst) document.getElementById('adv-gst').value = draft.gst;
        if (draft.pay) document.getElementById('adv-pay').value = draft.pay;
        
        document.getElementById('log-body').innerHTML = ''; // clear existing rows
        rowCount = 0;
        
        draft.rows.forEach(r => {
          addRow();
          const lastRowId = rowCount;
          const row = document.getElementById(`row-${lastRowId}`);
          row.querySelector('.row-cust').value = r.cust;
          row.querySelector('.row-veh').value = r.veh;
          row.querySelector('.row-dest').value = r.dest;
          row.querySelector('.row-mat').value = r.mat;
          row.querySelector('.row-trip').value = r.trip;
          row.querySelector('.row-qty').value = r.qty;
          row.querySelector('.row-rate').value = r.rate;
          row.querySelector('.row-total').value = r.total;
        });
        
        calculateGrandTotal();
        document.getElementById('btn-clear-draft').classList.remove('hidden');
        window.LSCUtils.showNotification('Draft restored.', 'success');
        
      } catch (err) {
        console.error("Failed to load draft", err);
        localStorage.removeItem('lsc_daily_log_draft');
        addRow();
      }
    }

    function clearDraft() {
       if (confirm('Are you sure you want to clear the draft? This cannot be undone.')) {
         localStorage.removeItem('lsc_daily_log_draft');
         document.getElementById('log-body').innerHTML = '';
         rowCount = 0;
         addRow();
         calculateGrandTotal();
         document.getElementById('btn-clear-draft').classList.add('hidden');
         window.LSCUtils.showNotification('Draft cleared.', 'success');
       }
    }
    // --- End Draft Logic ---

async function handleSaveLog(e) {
      e.preventDefault();
      
      const rows = document.querySelectorAll('#log-body tr');
      if (rows.length === 0) {
        alert("Please add at least one row.");
        return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = 'Saving...';

      try {
        const logDate = document.getElementById('log-date').value;
        const gstVal = parseFloat(document.getElementById('adv-gst').value) || 0;
        const isGst = gstVal > 0;
        const paySelection = document.getElementById('adv-pay').value; 
        const payStatus = paySelection === 'due' ? 'due' : 'full';
        const payMethod = paySelection === 'due' ? 'cash' : paySelection;
        
        // Group rows by customer
        const custGroups = {};

        rows.forEach(row => {
          const custSel = row.querySelector('.row-cust');
          const custId = parseInt(custSel.value);
          if (!custId) return; // Skip invalid rows (should be caught by required attribute though)
          
          if (!custGroups[custId]) custGroups[custId] = [];
          
          const veh = row.querySelector('.row-veh').value.trim();
          const dest = row.querySelector('.row-dest').value.trim();
          const matSel = row.querySelector('.row-mat');
          const matId = parseInt(matSel.value);
          const matName = matSel.options[matSel.selectedIndex].text;
          const trip = row.querySelector('.row-trip').value.trim();
          const qty = parseFloat(row.querySelector('.row-qty').value) || 0;
          const rate = parseFloat(row.querySelector('.row-rate').value) || 0;
          const amount = parseFloat(row.querySelector('.row-total').value) || 0;
          
          const extraParts = [];
          if (veh) extraParts.push(`Veh: ${veh}`);
          if (dest) extraParts.push(`Dest: ${dest}`);
          if (trip) extraParts.push(`Trip: ${trip}`);
          const extraStr = extraParts.length > 0 ? ', ' + extraParts.join(', ') : '';
          
          custGroups[custId].push({
            material_id: matId,
            custom_material_name: `${matName} (Dt: ${window.LSCUtils.formatDate(logDate)}${extraStr})`,
            quantity: qty,
            unit: 'Brass', // Fixed as per UI requirement "Brass(Qty)"
            rate: rate,
            amount: amount,
            vehicle_ref: veh // Storing to build notes
          });
        });

        // Save each group as a separate sale
        const salePromises = [];
        for (const custId in custGroups) {
           const items = custGroups[custId];
           let groupTotal = 0;
           let allVehicles = new Set();
           
           items.forEach(it => {
             groupTotal += it.amount;
             if (it.vehicle_ref) allVehicles.add(it.vehicle_ref);
           });
           
           const grandTotalWithGst = groupTotal + (isGst ? groupTotal * (gstVal/100) : 0);
           const amtPaid = payStatus === 'full' ? grandTotalWithGst : 0;
           const notes = Array.from(allVehicles).join(', ');

           const payload = {
             customer_id: parseInt(custId),
             sale_date: logDate,
             gst_enabled: isGst,
             gst_percent: isGst ? gstVal : 18,
             items: items,
             payment_mode: payStatus,
             payment_method: payMethod,
             amount_paid: amtPaid,
             notes: notes
           };
           
           salePromises.push(window.LSCDB.createSale(payload));
        }

        await Promise.all(salePromises);
        
        localStorage.removeItem('lsc_daily_log_draft');
        window.LSCUtils.showNotification(`Successfully saved ${salePromises.length} invoices!`, 'success');
        
        setTimeout(() => {
          window.location.href = 'sales.html';
        }, 800);

      } catch(err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.innerHTML = 'Save Daily Log';
      }
    }

    function openNewCustModal() { document.getElementById('modal-customer').classList.remove('hidden'); }
    function closeNewCustModal() { document.getElementById('modal-customer').classList.add('hidden'); document.getElementById('new-cust-form').reset(); }
    
    async function handleCreateCustomer(e) {
      e.preventDefault();
      try {
        const c = await window.LSCDB.addCustomer({
          name: document.getElementById('new-c-name').value,
          mobile: document.getElementById('new-c-mob').value,
          address: document.getElementById('new-c-addr').value
        });
        customers.push(c);
        
        // Refresh all dropdowns
        const selects = document.querySelectorAll('.row-cust');
        selects.forEach(sel => {
           const currentVal = sel.value;
           sel.innerHTML = getCustomerOptions();
           if (currentVal) sel.value = currentVal;
        });
        
        closeNewCustModal();
        window.LSCUtils.showNotification('Customer Added!', 'success');
      } catch(err) { alert(err.message); }
    }
  </script>

</body>
</html>
