<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Bill Entry - Lakshmi Stone Crusher & Suppliers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=1786617000">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=1786617000"></script>
  <script src="assets/js/supabase-client.js?v=1786617000"></script>
  <script src="assets/js/utils.js?v=1786617000"></script>
  <script src="assets/js/auth.js?v=1786617000"></script>
  <script src="assets/js/db-service.js?v=1786617000"></script>
  <script src="assets/js/layout.js?v=1786617000"></script>
</head>
<body>
  <div id="app">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">Quick Bill Entry</h1>
        <p class="text-xs text-gray-500 mt-0.5">Fast invoice generation</p>
      </div>
      <a href="sales.html" class="btn btn-secondary text-xs">View Past Sales</a>
    </div>

    <div class="card max-w-5xl mx-auto">
      <div class="card-header bg-blue-50 border-b border-blue-100 text-blue-900 text-sm py-3 px-6">Create New Bill</div>
      
      <form id="quick-bill-form" class="p-6 space-y-6" onsubmit="handleCreateBill(event)">
        <!-- Top Row: Customer & Date & Vehicle -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="md:col-span-1 relative">
            <label class="form-label text-[11px] uppercase text-gray-500 font-bold mb-1.5">Customer *</label>
            <div id="selected-customer-display" class="hidden flex items-center justify-between border border-emerald-300 bg-emerald-50 rounded-lg p-2.5">
              <div>
                <div class="font-bold text-sm text-emerald-900 leading-tight" id="disp-cust-name"></div>
                <div class="text-[11px] text-emerald-700 mt-0.5 font-medium" id="disp-cust-mobile"></div>
              </div>
              <button type="button" onclick="clearCustomer()" class="text-red-600 text-xs font-bold hover:underline">Change</button>
            </div>
            
            <div id="customer-search-container">
              <input type="text" id="cust-search" class="form-input" placeholder="Search name or mobile..." autocomplete="off" oninput="onCustSearch(this.value)">
              <div id="cust-results" class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-200 shadow-xl rounded-lg max-h-48 overflow-y-auto divide-y divide-gray-100 text-sm"></div>
              <button type="button" onclick="openNewCustModal()" class="text-[11px] text-blue-600 font-bold hover:underline mt-2 inline-block">+ Add New Customer</button>
            </div>
          </div>
          
          <div>
            <label class="form-label text-[11px] uppercase text-gray-500 font-bold mb-1.5">Invoice Date *</label>
            <input type="date" id="bill-date" required class="form-input text-sm">
          </div>
          
          <div>
            <label class="form-label text-[11px] uppercase text-gray-500 font-bold mb-1.5">Vehicle No (Optional)</label>
            <input type="text" id="bill-vehicle" placeholder="e.g. MH12AB1234" class="form-input text-sm uppercase">
          </div>
        </div>

        <hr class="border-gray-100 border-dashed">

        <!-- Bottom Row: Material, Qty, Rate, Total -->
        <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 shadow-inner">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
            <div class="md:col-span-3">
              <label class="form-label text-[11px] uppercase text-gray-500 font-bold mb-1.5">Material Type *</label>
              <select id="bill-material" required class="form-select text-sm font-semibold text-slate-800" onchange="onMaterialChange()">
                <option value="">-- Select Material --</option>
                <!-- populated via js -->
              </select>
            </div>
            
            <div class="md:col-span-3">
              <label class="form-label text-[11px] uppercase text-gray-500 font-bold mb-1.5">Quantity (Brass/Tonne) *</label>
              <div class="flex">
                <input type="number" id="bill-qty" required step="0.001" min="0.001" placeholder="0.000" class="form-input text-sm font-semibold rounded-r-none border-r-0" oninput="calcTotal()">
                <select id="bill-unit" class="form-select rounded-l-none bg-gray-100 w-24 text-[11px] px-2 font-bold" onchange="onMaterialChange()">
                  <option value="Brass">Brass</option>
                  <option value="Tonne">Tonne</option>
                  <option value="Trip">Trip</option>
                  <option value="Piece">Piece</option>
                </select>
              </div>
            </div>
            
            <div class="md:col-span-2">
              <label class="form-label text-[11px] uppercase text-gray-500 font-bold mb-1.5">Rate (₹) *</label>
              <input type="number" id="bill-rate" required step="0.01" min="0" placeholder="0.00" class="form-input text-sm font-semibold" oninput="calcTotal()">
            </div>
            
            <div class="md:col-span-4 bg-emerald-600 rounded-lg p-3 text-white shadow flex flex-col justify-center h-[46px] border border-emerald-700">
               <div class="text-[10px] text-emerald-200 uppercase font-bold tracking-wider leading-none mb-1">Total Amount</div>
               <div class="text-xl font-black leading-none tracking-tight" id="bill-total">₹0.00</div>
            </div>
          </div>
        </div>

        <!-- Hidden toggles for advanced options (Payment/GST) if they ever need it -->
        <details class="text-[11px] text-gray-500 group no-print">
          <summary class="cursor-pointer hover:text-gray-800 font-bold select-none inline-flex items-center gap-1">
            <svg class="w-3.5 h-3.5 group-open:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            Advanced Options (GST / Payment Status)
          </summary>
          <div class="p-4 mt-3 border border-gray-200 rounded-lg bg-white grid grid-cols-2 gap-4 shadow-sm">
             <div>
               <label class="form-label text-[10px] uppercase font-bold text-gray-500">GST Invoice</label>
               <select id="adv-gst" class="form-select text-xs font-semibold"><option value="0">NO GST (Plain Bill)</option><option value="18">18% GST</option></select>
             </div>
             <div>
               <label class="form-label text-[10px] uppercase font-bold text-gray-500">Payment Status</label>
               <select id="adv-pay" class="form-select text-xs font-semibold text-emerald-700">
                 <option value="full">Full Paid (Cash)</option>
                 <option value="due">Unpaid (Add to Ledger)</option>
               </select>
             </div>
          </div>
        </details>

        <div class="pt-2 flex justify-end">
          <button type="submit" id="btn-submit" class="btn btn-primary py-3 px-8 text-sm font-bold shadow-lg shadow-blue-500/30 flex items-center gap-2 hover:scale-105 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            Add Bill & Print
          </button>
        </div>
      </form>
    </div>

    <!-- Modals (Customer) -->
    <div id="modal-customer" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h3 class="font-semibold text-gray-900">Add New Customer</h3>
          <button type="button" onclick="closeNewCustModal()" class="text-gray-400 hover:text-gray-900">&times;</button>
        </div>
        <form id="new-cust-form" onsubmit="handleCreateCustomer(event)">
          <div class="modal-body space-y-4">
            <div><label class="form-label">Name *</label><input type="text" id="new-c-name" required class="form-input"></div>
            <div><label class="form-label">Mobile</label><input type="text" id="new-c-mob" class="form-input"></div>
            <div><label class="form-label">Address</label><input type="text" id="new-c-addr" class="form-input"></div>
          </div>
          <div class="modal-footer">
            <button type="button" onclick="closeNewCustModal()" class="btn btn-secondary text-xs font-bold">Cancel</button>
            <button type="submit" class="btn btn-primary text-xs font-bold">Save Customer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let materials = [];
    let customers = [];
    let selCustId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      window.LSCLayout.init('sale-new', 'Quick Bill Entry');
      
      // Default Date to Today
      document.getElementById('bill-date').value = window.LSCUtils.formatISO(new Date());

      // Load DB Data
      try {
        const [mats, custs] = await Promise.all([
          window.LSCDB.getMaterials(),
          window.LSCDB.getCustomers()
        ]);
        materials = mats;
        customers = custs;
        
        const matSel = document.getElementById('bill-material');
        mats.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          opt.dataset.rate = m.rate_per_unit || 0;
          opt.dataset.unit = m.unit || 'Brass';
          matSel.appendChild(opt);
        });
      } catch (err) {
        console.error(err);
      }
    });

    function onCustSearch(val) {
      const box = document.getElementById('cust-results');
      if (!val.trim()) { box.classList.add('hidden'); return; }
      
      const term = val.toLowerCase();
      const matches = customers.filter(c => (c.name||'').toLowerCase().includes(term) || (c.mobile||'').includes(term));
      
      if (matches.length === 0) {
        box.innerHTML = '<div class="p-3 text-gray-400 text-xs">No match found</div>';
      } else {
        box.innerHTML = matches.map(c => `
          <div onclick="selectCust(${c.id})" class="p-3 hover:bg-blue-50 cursor-pointer flex justify-between items-center transition-colors border-b border-gray-100 last:border-0">
            <span class="font-bold text-slate-800">${c.name}</span>
            <span class="text-slate-500 text-xs">${c.mobile || ''}</span>
          </div>
        `).join('');
      }
      box.classList.remove('hidden');
    }

    function selectCust(id) {
      const c = customers.find(x => x.id === id);
      if(!c) return;
      selCustId = c.id;
      document.getElementById('disp-cust-name').textContent = c.name;
      document.getElementById('disp-cust-mobile').textContent = c.mobile || c.address || 'No details';
      document.getElementById('customer-search-container').classList.add('hidden');
      document.getElementById('selected-customer-display').classList.remove('hidden');
      document.getElementById('cust-results').classList.add('hidden');
    }

    function clearCustomer() {
      selCustId = null;
      document.getElementById('cust-search').value = '';
      document.getElementById('selected-customer-display').classList.add('hidden');
      document.getElementById('customer-search-container').classList.remove('hidden');
    }

    function onMaterialChange() {
      const sel = document.getElementById('bill-material');
      if (!sel.value) return;
      const opt = sel.options[sel.selectedIndex];
      if (opt.dataset.rate && opt.dataset.rate !== "null") document.getElementById('bill-rate').value = opt.dataset.rate;
      if (opt.dataset.unit && opt.dataset.unit !== "null") document.getElementById('bill-unit').value = opt.dataset.unit;
      calcTotal();
    }

    function calcTotal() {
      const qty = parseFloat(document.getElementById('bill-qty').value) || 0;
      const rate = parseFloat(document.getElementById('bill-rate').value) || 0;
      const total = qty * rate;
      document.getElementById('bill-total').textContent = window.LSCUtils.formatCurrency(total);
    }

    async function handleCreateBill(e) {
      e.preventDefault();
      if (!selCustId) {
        alert("Please select or add a customer first!");
        return;
      }
      
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = 'Saving...';

      try {
        const matSel = document.getElementById('bill-material');
        const matId = parseInt(matSel.value);
        const matOpt = matSel.options[matSel.selectedIndex];
        const qty = parseFloat(document.getElementById('bill-qty').value);
        const rate = parseFloat(document.getElementById('bill-rate').value);
        const unit = document.getElementById('bill-unit').value;
        const total = qty * rate;
        
        const gstVal = parseFloat(document.getElementById('adv-gst').value);
        const isGst = gstVal > 0;
        const grandTotal = total + (isGst ? total * (gstVal/100) : 0);
        
        const payStatus = document.getElementById('adv-pay').value; // full or due
        const amtPaid = payStatus === 'full' ? grandTotal : 0;

        const res = await window.LSCDB.createSale({
          customer_id: selCustId,
          sale_date: document.getElementById('bill-date').value,
          gst_enabled: isGst,
          gst_percent: isGst ? gstVal : 18,
          items: [{
            material_id: matId,
            custom_material_name: matOpt.text,
            quantity: qty,
            unit: unit,
            rate: rate
          }],
          payment_mode: payStatus,
          payment_method: 'cash',
          amount_paid: amtPaid,
          notes: document.getElementById('bill-vehicle').value
        });

        window.LSCUtils.showNotification('Bill generated successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'sale-details.html?id=' + res.sale_id;
        }, 500);

      } catch(err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.innerHTML = 'Add Bill & Print';
      }
    }

    function openNewCustModal() { document.getElementById('modal-customer').classList.remove('hidden'); }
    function closeNewCustModal() { document.getElementById('modal-customer').classList.add('hidden'); document.getElementById('new-cust-form').reset(); }
    
    async function handleCreateCustomer(e) {
      e.preventDefault();
      try {
        const c = await window.LSCDB.addCustomer({
          name: document.getElementById('new-c-name').value,
          mobile: document.getElementById('new-c-mob').value,
          address: document.getElementById('new-c-addr').value
        });
        customers.push(c);
        selectCust(c.id);
        closeNewCustModal();
        window.LSCUtils.showNotification('Customer Added!', 'success');
      } catch(err) { alert(err.message); }
    }
  </script>
</body>
</html>
