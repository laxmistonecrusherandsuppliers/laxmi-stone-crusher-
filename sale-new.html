<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Bill Entry - Lakshmi Stone Crusher & Suppliers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=1786617004">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=1786617004"></script>
  <script src="assets/js/supabase-client.js?v=1786617004"></script>
  <script src="assets/js/utils.js?v=1786617004"></script>
  <script src="assets/js/auth.js?v=1786617004"></script>
  <script src="assets/js/db-service.js?v=1786617004"></script>
  <script src="assets/js/layout.js?v=1786617004"></script>
</head>
<body>
  <div id="app">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">Quick Bill Entry</h1>
        <p class="text-xs text-gray-500 mt-0.5">Fast invoice generation</p>
      </div>
      <a href="sales.html" class="btn btn-secondary text-xs">View Past Sales</a>
    </div>

    <div class="card max-w-5xl mx-auto">
      <div class="card-header bg-blue-50 border-b border-blue-100 text-blue-900 text-sm py-3 px-6">Create New Bill</div>
      
      <form id="quick-bill-form" class="p-6 space-y-6" onsubmit="handleCreateBill(event)">
        <!-- Top Row: Customer -->
        <div class="mb-4 relative max-w-xl">
          <label class="form-label text-[11px] uppercase text-gray-500 font-bold mb-1.5">Customer Name *</label>
          <div id="selected-customer-display" class="hidden flex items-center justify-between border border-emerald-300 bg-emerald-50 rounded-lg p-2.5">
            <div>
              <div class="font-bold text-sm text-emerald-900 leading-tight" id="disp-cust-name"></div>
              <div class="text-[11px] text-emerald-700 mt-0.5 font-medium" id="disp-cust-mobile"></div>
            </div>
            <button type="button" onclick="clearCustomer()" class="text-red-600 text-xs font-bold hover:underline">Change</button>
          </div>
          
          <div id="customer-search-container">
            <input type="text" id="cust-search" class="form-input text-sm" placeholder="Search name or mobile..." autocomplete="off" oninput="onCustSearch(this.value)">
            <div id="cust-results" class="hidden absolute z-20 w-full mt-1 bg-white border border-gray-200 shadow-xl rounded-lg max-h-48 overflow-y-auto divide-y divide-gray-100 text-sm"></div>
            <button type="button" onclick="openNewCustModal()" class="text-[11px] text-blue-600 font-bold hover:underline mt-2 inline-block">+ Add New Customer</button>
          </div>
        </div>

        <hr class="border-gray-100 border-dashed">

        <!-- Dynamic Entries Container -->
        <div id="entries-container" class="space-y-6">
           <!-- Populated dynamically by JS -->
        </div>

        <div class="flex justify-between items-center border-t border-gray-200 pt-4">
          <button type="button" onclick="addEntry()" class="btn btn-secondary text-sm font-bold flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Add New Entry
          </button>
          
          <div class="bg-blue-600 rounded-lg p-3 text-white shadow-md flex flex-col justify-center border border-blue-700 min-w-[200px] text-right">
             <div class="text-[10px] text-blue-200 uppercase font-bold tracking-wider mb-1">Grand Total Amount</div>
             <div class="text-2xl font-black tracking-tight" id="grand-total-display">₹0.00</div>
          </div>
        </div>

        <!-- Billing & Payment Options -->
        <div class="p-4 mt-2 border border-gray-200 rounded-lg bg-slate-50 grid grid-cols-1 sm:grid-cols-2 gap-6 shadow-sm no-print">
           <div>
             <label class="form-label text-[11px] uppercase font-bold text-gray-600 mb-1.5">GST Settings</label>
             <select id="adv-gst" class="form-select text-sm font-semibold h-10" onchange="calculateGrandTotal()">
               <option value="0">NO GST (Plain Bill)</option>
               <option value="18">18% GST (Tax Invoice)</option>
             </select>
           </div>
           <div>
             <label class="form-label text-[11px] uppercase font-bold text-gray-600 mb-1.5">Payment Method *</label>
             <select id="adv-pay" class="form-select text-sm font-semibold h-10 text-emerald-700">
               <option value="cash">💰 Cash (Full Paid)</option>
               <option value="upi">📱 UPI / Online (Full Paid)</option>
               <option value="due">📒 Keep Due (Add to Ledger)</option>
             </select>
           </div>
        </div>

        <div class="pt-2 flex justify-end">
          <button type="submit" id="btn-submit" class="btn btn-primary py-3 px-8 text-sm font-bold shadow-lg shadow-blue-500/30 flex items-center gap-2 hover:scale-105 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            Save All Entries & Print
          </button>
        </div>
      </form>
    </div>

    <!-- Modals (Customer) -->
    <div id="modal-customer" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h3 class="font-semibold text-gray-900">Add New Customer</h3>
          <button type="button" onclick="closeNewCustModal()" class="text-gray-400 hover:text-gray-900">&times;</button>
        </div>
        <form id="new-cust-form" onsubmit="handleCreateCustomer(event)">
          <div class="modal-body space-y-4">
            <div><label class="form-label">Name *</label><input type="text" id="new-c-name" required class="form-input"></div>
            <div><label class="form-label">Mobile</label><input type="text" id="new-c-mob" class="form-input"></div>
            <div><label class="form-label">Address</label><input type="text" id="new-c-addr" class="form-input"></div>
          </div>
          <div class="modal-footer">
            <button type="button" onclick="closeNewCustModal()" class="btn btn-secondary text-xs font-bold">Cancel</button>
            <button type="submit" class="btn btn-primary text-xs font-bold">Save Customer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let materials = [];
    let customers = [];
    let selCustId = null;

    let entryCounter = 0;
    let itemCounter = 0;

    let editSaleId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      window.LSCLayout.init('sale-new', 'Quick Bill Entry');
      
      try {
        const [mats, custs] = await Promise.all([
          window.LSCDB.getMaterials(),
          window.LSCDB.getCustomers()
        ]);
        materials = mats;
        customers = custs;

        editSaleId = window.LSCUtils.getQueryParam('edit_id');
        if (editSaleId) {
          document.querySelector('h1').textContent = 'Edit Bill';
          document.querySelector('.card-header').textContent = 'Edit Invoice #' + editSaleId; // will be overwritten below if possible
          document.getElementById('btn-submit').innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg> Update Bill & Print';
          
          const sale = await window.LSCDB.getSaleById(editSaleId);
          document.querySelector('.card-header').textContent = 'Edit Invoice #' + sale.invoice_number;
          selectCust(sale.customer_id);
          
          document.getElementById('adv-gst').value = sale.gst_enabled ? (sale.gst_percent || "18") : "0";
          
          let payVal = 'due';
          if (sale.payment_mode === 'full' || sale.payment_mode === 'partial') {
             const firstLog = sale.payment_logs && sale.payment_logs.length > 0 ? sale.payment_logs[0] : null;
             payVal = (firstLog && firstLog.payment_mode === 'upi') ? 'upi' : 'cash';
          }
          document.getElementById('adv-pay').value = payVal;

          // Group items by entry (date + vehicle)
          const entriesMap = {};
          (sale.items || []).forEach(item => {
            let matName = item.custom_material_name || item.material_name || 'N/A';
            let itemDate = sale.sale_date.split('T')[0];
            let itemVeh = '';
            let itemDest = '';
            let itemChallan = '';
            
            const regex = /\(Dt:\s*([^,)]*)(?:,\s*Veh:\s*([^,)]*))?(?:,\s*Dest:\s*([^,)]*))?(?:,\s*Ch\.No:\s*([^)]*))?\)$/;
            const match = matName.match(regex);
            if (match) {
               const dParts = new Date(match[1]);
               if (!isNaN(dParts.getTime())) {
                   itemDate = dParts.toISOString().split('T')[0];
               }
               itemVeh = (match[2] || '').trim();
               itemDest = (match[3] || '').trim();
               itemChallan = (match[4] || '').trim();
               matName = matName.replace(regex, '').trim();
            }
            
            const key = itemDate + '|' + itemVeh + '|' + itemDest + '|' + itemChallan;
            if(!entriesMap[key]) entriesMap[key] = { date: itemDate, vehicle: itemVeh, dest: itemDest, challan: itemChallan, items: [] };
            entriesMap[key].items.push({ ...item, cleanName: matName });
          });

          // Render groups
          for (const key in entriesMap) {
             const group = entriesMap[key];
             const eid = addEntry(group.date, group.vehicle, group.dest, group.challan, false);
             group.items.forEach(it => {
                 addItem(eid, { material_id: it.material_id, qty: it.quantity, rate: it.rate, unit: it.unit });
             });
          }
          calculateGrandTotal();

        } else {
          // Add initial empty entry for new bill
          addEntry();
        }
        
      } catch (err) {
        console.error(err);
        alert('Error loading data: ' + err.message);
      }
    });

    function onCustSearch(val) {
      const box = document.getElementById('cust-results');
      if (!val.trim()) { box.classList.add('hidden'); return; }
      
      const term = val.toLowerCase();
      const matches = customers.filter(c => (c.name||'').toLowerCase().includes(term) || (c.mobile||'').includes(term));
      
      if (matches.length === 0) {
        box.innerHTML = '<div class="p-3 text-gray-400 text-xs">No match found</div>';
      } else {
        box.innerHTML = matches.map(c => `
          <div onclick="selectCust(${c.id})" class="p-3 hover:bg-blue-50 cursor-pointer flex justify-between items-center transition-colors border-b border-gray-100 last:border-0">
            <span class="font-bold text-slate-800">${c.name}</span>
            <span class="text-slate-500 text-xs">${c.mobile || ''}</span>
          </div>
        `).join('');
      }
      box.classList.remove('hidden');
    }

    function selectCust(id) {
      const c = customers.find(x => x.id === id);
      if(!c) return;
      selCustId = c.id;
      document.getElementById('disp-cust-name').textContent = c.name;
      document.getElementById('disp-cust-mobile').textContent = c.mobile || c.address || 'No details';
      document.getElementById('customer-search-container').classList.add('hidden');
      document.getElementById('selected-customer-display').classList.remove('hidden');
      document.getElementById('cust-results').classList.add('hidden');
    }

    function clearCustomer() {
      selCustId = null;
      document.getElementById('cust-search').value = '';
      document.getElementById('selected-customer-display').classList.add('hidden');
      document.getElementById('customer-search-container').classList.remove('hidden');
    }

    function getMaterialOptions() {
      return materials.map(m => `<option value="${m.id}" data-rate="${m.rate_per_unit || 0}" data-unit="${m.unit || 'Brass'}">${m.name}</option>`).join('');
    }

    function addEntry(dateStr = null, vehStr = null, destStr = null, challanStr = null, autoAddItem = true) {
      entryCounter++;
      const eid = entryCounter;
      const today = dateStr || window.LSCUtils.formatISO(new Date());
      const v = vehStr || '';
      const d = destStr || '';
      const c = challanStr || '';

      const template = `
        <div id="entry-${eid}" class="entry-box bg-slate-50 p-5 rounded-xl border border-slate-200 shadow-inner relative">
          <button type="button" onclick="removeEntry(${eid})" class="absolute top-4 right-4 text-red-500 hover:text-red-700 font-bold text-xs" title="Remove Entry">&times; Remove Entry</button>
          
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 pr-24">
            <div>
              <label class="form-label text-[10px] uppercase text-gray-500 font-bold mb-1.5">Entry Date *</label>
              <input type="date" required class="entry-date form-input text-xs px-3 h-9" value="${today}">
            </div>
            <div>
              <label class="form-label text-[10px] uppercase text-gray-500 font-bold mb-1.5">Vehicle No</label>
              <input type="text" placeholder="MH12AB1234" class="entry-vehicle form-input text-xs uppercase px-3 h-9" value="${v}">
            </div>
            <div>
              <label class="form-label text-[10px] uppercase text-gray-500 font-bold mb-1.5">Destination</label>
              <input type="text" placeholder="Site Location" class="entry-dest form-input text-xs px-3 h-9" value="${d}">
            </div>
            <div>
              <label class="form-label text-[10px] uppercase text-gray-500 font-bold mb-1.5">Challan No</label>
              <input type="text" placeholder="CH-101" class="entry-challan form-input text-xs uppercase px-3 h-9" value="${c}">
            </div>
          </div>
          
          <div class="items-container space-y-3" id="items-container-${eid}">
            <!-- Items added here -->
          </div>

          <div class="mt-4 flex justify-between items-center border-t border-slate-200 pt-4">
            <button type="button" onclick="addItem(${eid})" class="text-blue-600 text-xs font-bold hover:underline flex items-center gap-1">
              + Add Item
            </button>
            <div class="text-emerald-700 font-black text-sm">
              Entry Total: <span class="entry-total">₹0.00</span>
            </div>
          </div>
        </div>
      `;

      const div = document.createElement('div');
      div.innerHTML = template.trim();
      document.getElementById('entries-container').appendChild(div.firstChild);
      
      if (autoAddItem) {
        addItem(eid);
        calculateGrandTotal();
      }
      return eid;
    }

    function removeEntry(eid) {
      if (document.querySelectorAll('.entry-box').length <= 1) {
        alert("You must have at least one entry.");
        return;
      }
      document.getElementById(`entry-${eid}`).remove();
      calculateGrandTotal();
    }

    function addItem(eid, initData = null) {
      itemCounter++;
      const iid = itemCounter;
      
      let matVal = initData ? initData.material_id : '';
      let qtyVal = initData ? initData.qty : '';
      let rateVal = initData ? initData.rate : '';
      let unitVal = initData ? initData.unit : 'Brass';
      
      // We must render options and pre-select if initData is present
      const opts = materials.map(m => `<option value="${m.id}" data-rate="${m.rate_per_unit || 0}" data-unit="${m.unit || 'Brass'}" ${m.id == matVal ? 'selected' : ''}>${m.name}</option>`).join('');

      const template = `
        <div id="item-${iid}" class="item-row grid grid-cols-2 md:grid-cols-12 gap-3 items-end bg-white p-3 rounded border border-gray-100 shadow-sm relative pr-8">
          <button type="button" onclick="removeItem(${iid})" class="absolute top-1/2 -translate-y-1/2 right-2 text-red-400 hover:text-red-600 font-bold text-lg" title="Remove Item">&times;</button>
          
          <div class="md:col-span-4">
            <label class="form-label text-[9px] uppercase text-gray-400 font-bold mb-1">Material Type *</label>
            <select required class="item-material form-select text-xs font-semibold text-slate-800 px-2 h-8" onchange="onMaterialChange(${iid})">
              <option value="">-- Select --</option>
              ${opts}
            </select>
          </div>
          
          <div class="md:col-span-3">
            <label class="form-label text-[9px] uppercase text-gray-400 font-bold mb-1">Quantity *</label>
            <div class="flex h-8">
              <input type="number" required step="0.001" min="0.001" placeholder="0.00" class="item-qty form-input text-xs font-semibold rounded-r-none border-r-0 px-2 w-16 flex-1" value="${qtyVal}" oninput="calculateGrandTotal()">
              <select class="item-unit form-select rounded-l-none bg-gray-100 text-[10px] px-1 w-14 font-bold border-l-gray-300">
                <option value="Brass" ${unitVal === 'Brass' ? 'selected' : ''}>Brass</option>
                <option value="Tonne" ${unitVal === 'Tonne' ? 'selected' : ''}>Tonne</option>
                <option value="Trip" ${unitVal === 'Trip' ? 'selected' : ''}>Trip</option>
              </select>
            </div>
          </div>
          
          <div class="md:col-span-2">
            <label class="form-label text-[9px] uppercase text-gray-400 font-bold mb-1">Rate (₹) *</label>
            <input type="number" required step="0.01" min="0" placeholder="0" class="item-rate form-input text-xs font-semibold px-2 h-8 w-full" value="${rateVal}" oninput="calculateGrandTotal()">
          </div>
          
          <div class="md:col-span-3">
            <label class="form-label text-[9px] uppercase text-gray-400 font-bold mb-1 text-right block">Total</label>
            <div class="bg-gray-50 rounded px-2 text-gray-900 shadow-sm flex items-center justify-end h-8 border border-gray-200">
               <div class="text-[13px] font-bold tracking-tight item-total">₹0.00</div>
            </div>
          </div>
        </div>
      `;

      const div = document.createElement('div');
      div.innerHTML = template.trim();
      document.getElementById(`items-container-${eid}`).appendChild(div.firstChild);
    }

    function removeItem(iid) {
      const row = document.getElementById(`item-${iid}`);
      const entryBox = row.closest('.entry-box');
      if (entryBox.querySelectorAll('.item-row').length <= 1) {
        alert("An entry must have at least one material item.");
        return;
      }
      row.remove();
      calculateGrandTotal();
    }

    function onMaterialChange(iid) {
      const row = document.getElementById(`item-${iid}`);
      const sel = row.querySelector('.item-material');
      if (!sel.value) return;
      
      const opt = sel.options[sel.selectedIndex];
      if (opt.dataset.rate) row.querySelector('.item-rate').value = opt.dataset.rate;
      if (opt.dataset.unit) row.querySelector('.item-unit').value = opt.dataset.unit;
      
      calculateGrandTotal();
    }

    function calculateGrandTotal() {
      let grandTotal = 0;

      const entries = document.querySelectorAll('.entry-box');
      entries.forEach(entry => {
        let entryTotal = 0;
        const items = entry.querySelectorAll('.item-row');
        
        items.forEach(item => {
          const qty = parseFloat(item.querySelector('.item-qty').value) || 0;
          const rate = parseFloat(item.querySelector('.item-rate').value) || 0;
          const total = qty * rate;
          item.querySelector('.item-total').textContent = window.LSCUtils.formatCurrency(total);
          entryTotal += total;
        });

        entry.querySelector('.entry-total').textContent = window.LSCUtils.formatCurrency(entryTotal);
        grandTotal += entryTotal;
      });

      const gstVal = parseFloat(document.getElementById('adv-gst').value);
      if (gstVal > 0) {
        grandTotal += grandTotal * (gstVal / 100);
      }

      document.getElementById('grand-total-display').textContent = window.LSCUtils.formatCurrency(grandTotal);
    }

    async function handleCreateBill(e) {
      e.preventDefault();
      if (!selCustId) {
        alert("Please select or add a customer first!");
        return;
      }
      
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = 'Saving...';

      try {
        // Collect all nested entries
        const entryBoxes = document.querySelectorAll('.entry-box');
        let allItems = [];
        let allVehicles = new Set();
        let finalGrandTotal = 0;

        entryBoxes.forEach(box => {
          const date = box.querySelector('.entry-date').value;
          const vehicle = box.querySelector('.entry-vehicle').value.trim();
          const dest = box.querySelector('.entry-dest').value.trim();
          const challan = box.querySelector('.entry-challan').value.trim();
          if (vehicle) allVehicles.add(vehicle);

          const extraParts = [];
          if (vehicle) extraParts.push(`Veh: ${vehicle}`);
          if (dest) extraParts.push(`Dest: ${dest}`);
          if (challan) extraParts.push(`Ch.No: ${challan}`);
          const extraStr = extraParts.length > 0 ? ', ' + extraParts.join(', ') : '';

          const itemRows = box.querySelectorAll('.item-row');
          itemRows.forEach(row => {
            const matSel = row.querySelector('.item-material');
            const matId = parseInt(matSel.value);
            const matName = matSel.options[matSel.selectedIndex].text;
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
            const unit = row.querySelector('.item-unit').value;
            
            finalGrandTotal += (qty * rate);

            // Flatten data for Supabase while preserving Entry context in the material name
            allItems.push({
              material_id: matId,
              custom_material_name: `${matName} (Dt: ${window.LSCUtils.formatDate(date)}${extraStr})`,
              quantity: qty,
              unit: unit,
              rate: rate
            });
          });
        });

        const gstVal = parseFloat(document.getElementById('adv-gst').value);
        const isGst = gstVal > 0;
        const grandTotalWithGst = finalGrandTotal + (isGst ? finalGrandTotal * (gstVal/100) : 0);
        
        const paySelection = document.getElementById('adv-pay').value; 
        const payStatus = paySelection === 'due' ? 'due' : 'full';
        const payMethod = paySelection === 'due' ? 'cash' : paySelection;
        const amtPaid = payStatus === 'full' ? grandTotalWithGst : 0;
        
        // Join all unique vehicles to store in parent notes
        const notes = Array.from(allVehicles).join(', ');

        const payload = {
          customer_id: selCustId,
          sale_date: window.LSCUtils.formatISO(new Date()),
          gst_enabled: isGst,
          gst_percent: isGst ? gstVal : 18,
          items: allItems,
          payment_mode: payStatus,
          payment_method: payMethod,
          amount_paid: amtPaid,
          notes: notes
        };

        let res;
        if (editSaleId) {
            res = await window.LSCDB.updateSale(editSaleId, payload);
            window.LSCUtils.showNotification('Bill updated successfully!', 'success');
        } else {
            res = await window.LSCDB.createSale(payload);
            window.LSCUtils.showNotification('Nested Bill generated successfully!', 'success');
        }
        
        setTimeout(() => {
          window.location.href = 'sale-details.html?id=' + res.sale_id;
        }, 500);

      } catch(err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.innerHTML = 'Save All Entries & Print';
      }
    }

    function openNewCustModal() { document.getElementById('modal-customer').classList.remove('hidden'); }
    function closeNewCustModal() { document.getElementById('modal-customer').classList.add('hidden'); document.getElementById('new-cust-form').reset(); }
    
    async function handleCreateCustomer(e) {
      e.preventDefault();
      try {
        const c = await window.LSCDB.addCustomer({
          name: document.getElementById('new-c-name').value,
          mobile: document.getElementById('new-c-mob').value,
          address: document.getElementById('new-c-addr').value
        });
        customers.push(c);
        selectCust(c.id);
        closeNewCustModal();
        window.LSCUtils.showNotification('Customer Added!', 'success');
      } catch(err) { alert(err.message); }
    }
  </script>
</body>
</html>
