<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lakshmi Stone Crusher & Suppliers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=1786617003">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script src="assets/js/config.js?v=1786617003"></script>
  <script src="assets/js/supabase-client.js?v=1786617003"></script>
  <script src="assets/js/utils.js?v=1786617003"></script>
  <script src="assets/js/auth.js?v=1786617003"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700/50">
    <!-- Header banner -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-8 text-center text-white relative">
      <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-xl overflow-hidden p-1 border-4 border-white/20">
        <img src="assets/images/logo.png" alt="Lakshmi Stone Crusher Logo" class="w-full h-full object-contain rounded-full">
      </div>
      <h1 class="text-xl font-bold tracking-tight">Lakshmi Stone Crusher</h1>
      <p class="text-xs text-blue-200 mt-1 font-medium">& Suppliers Management Portal</p>
    </div>

    <!-- Login Form -->
    <div class="p-8">
      <div id="error-alert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-xs font-medium"></div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="identifier" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Username or Mobile</label>
          <div class="relative">
            <input type="text" id="identifier" name="identifier" required placeholder="e.g. admin or 9999999999"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" required placeholder="Enter account password"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
        </div>

        <button type="submit" id="login-btn"
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
          <span>Sign In to Dashboard</span>
        </button>
      </form>

      <!-- Default Credentials Tip -->
      <div class="mt-6 pt-6 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-500 mb-2 font-medium">Default Credentials</p>
        <div class="flex justify-center gap-4 text-xs">
          <span class="px-2.5 py-1 bg-slate-100 rounded text-slate-600">Admin: <strong>admin</strong> / <strong>admin123</strong></span>
          <span class="px-2.5 py-1 bg-slate-100 rounded text-slate-600">Staff: <strong>staff1</strong> / <strong>staff123</strong></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to index
      if (window.LSCAuth.isAuthenticated()) {
        window.location.href = 'index.html';
      }

      const form = document.getElementById('login-form');
      const errAlert = document.getElementById('error-alert');
      const loginBtn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errAlert.classList.add('hidden');
        loginBtn.disabled = true;
        loginBtn.innerHTML = 'Verifying credentials...';

        const identifier = document.getElementById('identifier').value;
        const password = document.getElementById('password').value;

        try {
          await window.LSCAuth.login(identifier, password);
          window.location.href = 'index.html';
        } catch (err) {
          errAlert.textContent = err.message || 'Login failed. Please check credentials.';
          errAlert.classList.remove('hidden');
        } finally {
          loginBtn.disabled = false;
          loginBtn.innerHTML = 'Sign In to Dashboard';
        }
      });
    });
  </script>
</body>
</html>
