<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lakshmi Stone Crusher & Suppliers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css?v=1787172100">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script src="assets/js/config.js?v=1787172100"></script>
  <script src="assets/js/supabase-client.js?v=1787172100"></script>
  <script src="assets/js/utils.js?v=1787172100"></script>
  <script src="assets/js/auth.js?v=1787172100"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700/50">
    <!-- Header banner -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-8 text-center text-white relative">
      <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-xl overflow-hidden p-1 border-4 border-white/20">
        <img src="assets/images/logo.png" alt="Lakshmi Stone Crusher Logo" class="w-full h-full object-contain rounded-full">
      </div>
      <h1 class="text-xl font-bold tracking-tight">Lakshmi Stone Crusher</h1>
      <p class="text-xs text-blue-200 mt-1 font-medium">& Suppliers Management Portal</p>
    </div>

    <!-- Login Form -->
    <div class="p-8">
      <div id="error-alert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-xs font-medium"></div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="identifier" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Username or Mobile</label>
          <div class="relative">
            <input type="text" id="identifier" name="identifier" required placeholder="e.g. admin or 9699985749"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" required placeholder="Enter account password"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
        </div>

        <button type="submit" id="login-btn"
          class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
          <span>Sign In to Dashboard</span>
        </button>
      </form>

      <!-- Forgot Password Link -->
      <div class="mt-4 text-center">
        <a href="#" id="forgot-password-link" class="text-xs text-blue-600 hover:text-blue-800 font-semibold transition-colors">Forgot Password?</a>
      </div>
    </div>
  </div>

  <!-- Password Reset Modal -->
  <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden transform transition-all">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <h3 class="text-lg font-bold text-slate-800">Reset Password</h3>
        <button id="close-reset-modal" class="text-slate-400 hover:text-slate-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="p-6">
        <p class="text-sm text-slate-600 mb-4">Please contact the system administrator to reset your password. If you are the administrator, please reset via the database or Supabase console.</p>
        <div class="space-y-4">
          <div class="p-3 bg-blue-50 border border-blue-100 rounded-lg text-sm text-blue-800">
            <strong>Admin Contact:</strong> +91 9699985749
          </div>
          <button id="understood-btn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-lg transition-all">
            Understood
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to index
      if (window.LSCAuth.isAuthenticated()) {
        window.location.href = 'sales.html';
      }

      const form = document.getElementById('login-form');
      const errAlert = document.getElementById('error-alert');
      const loginBtn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errAlert.classList.add('hidden');
        loginBtn.disabled = true;
        loginBtn.innerHTML = 'Verifying credentials...';

        const identifier = document.getElementById('identifier').value;
        const password = document.getElementById('password').value;

        try {
          await window.LSCAuth.login(identifier, password);
          window.location.href = 'sales.html';
        } catch (err) {
          errAlert.textContent = err.message || 'Login failed. Please check credentials.';
          errAlert.classList.remove('hidden');
        } finally {
          loginBtn.disabled = false;
          loginBtn.innerHTML = 'Sign In to Dashboard';
        }
      });

      // Password Reset Modal Logic
      const forgotPasswordLink = document.getElementById('forgot-password-link');
      const resetModal = document.getElementById('reset-modal');
      const closeResetModal = document.getElementById('close-reset-modal');
      const understoodBtn = document.getElementById('understood-btn');

      function openModal(e) {
        if (e) e.preventDefault();
        resetModal.classList.remove('hidden');
      }

      function closeModal() {
        resetModal.classList.add('hidden');
      }

      if (forgotPasswordLink) forgotPasswordLink.addEventListener('click', openModal);
      if (closeResetModal) closeResetModal.addEventListener('click', closeModal);
      if (understoodBtn) understoodBtn.addEventListener('click', closeModal);
      
      // Close modal on outside click
      resetModal.addEventListener('click', (e) => {
        if (e.target === resetModal) closeModal();
      });
    });
  </script>
</body>
</html>
