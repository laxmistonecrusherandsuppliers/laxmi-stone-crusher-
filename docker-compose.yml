version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lsc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lsc_user
      POSTGRES_PASSWORD: lsc_pass
      POSTGRES_DB: lsc_db
    ports:
      - '5432:5432'
    volumes:
      - lsc_pgdata:/var/lib/postgresql/data
      - ./server/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lsc_user -d lsc_db']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: lsc_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lsc_user:lsc_pass@postgres:5432/lsc_db
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_super_secret_key}
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
    ports:
      - '5000:5000'
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: lsc_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'

volumes:
  lsc_pgdata:
    driver: local
